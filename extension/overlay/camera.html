<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Omnipotent camera</title>
    <style>
      :root {
        --ink: #101014;
        --ink-2: #17171d;
        --bone: #f4f1ea;
        --signal: #c0392b;
        --sage: #6e7566;
        --line: rgba(244, 241, 234, 0.24);
        --mono: "Roboto Mono", "IBM Plex Mono", ui-monospace, "DejaVu Sans Mono",
          "Liberation Mono", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      /* Clipped to a circle by the host, so this document fills it edge to edge. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        font-family: var(--mono);
        cursor: grab;
        user-select: none;
      }
      body.dragging {
        cursor: grabbing;
      }
      #wrap {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: var(--ink);
      }
      canvas.mirror {
        transform: scaleX(-1);
      }
      #fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        text-align: center;
        padding: 18%;
        color: rgba(244, 241, 234, 0.5);
        background: var(--ink);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      #fallback.on {
        display: grid;
      }
      /* Tools sit well inside the circle so the clip never eats them. vmin here
         is the bubble's own diameter, so the strip scales with the bubble. */
      #tools {
        position: absolute;
        left: 50%;
        bottom: 15%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        font-size: min(9px, 6.4vmin);
        gap: 0.3em;
        padding: 0.35em;
        border-radius: 999px;
        background: rgba(16, 18, 22, 0.88);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        opacity: 0;
        transition: opacity 0.12s;
      }
      body:hover #tools {
        opacity: 1;
      }
      button {
        min-width: 1.9em;
        height: 1.9em;
        padding: 0 0.25em;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(244, 241, 234, 0.72);
        font-family: var(--mono);
        font-size: 1em;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.12s, color 0.12s;
      }
      button:hover {
        background: rgba(244, 241, 234, 0.14);
        color: var(--bone);
      }
      button svg {
        width: 1em;
        height: 1em;
        fill: currentColor;
        display: block;
      }
      button[aria-pressed="true"] {
        background: var(--bone);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="cam" width="300" height="300"></canvas>
      <div id="fallback">Connecting…</div>
      <div id="tools">
        <button id="size-sm" type="button" title="Small">S</button>
        <button id="size-md" type="button" title="Medium">M</button>
        <button id="size-lg" type="button" title="Large">L</button>
        <button id="mirror" type="button" title="Mirror">
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M5.4 1h1.2v10H5.4z" />
            <path d="M4.4 3.4v5.2L1.2 6z" />
            <path d="M7.6 3.4v5.2L10.8 6z" />
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="camera.js"></script>
  </body>
</html>
